<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>LEDBLE Controller</title>
        <link rel="stylesheet" href="styles.css" />
        <script src="scripts.js" defer></script>
    </head>
    <body>
        <h1>Strip controller</h1>
        <button id="connectButton">connect</button>
        <div id="status">Not connected</div>
        <br><br>
        <button id="onButton">POWER ON</button>
        <button id="offButton">POWER OFF</button>
        <br><br>
        <div>
            R: <input type="range" id="sliderR" min="0" max="255" value="255">
            <input type="number" id="numberR" min="0" max="255" value="255">
        </div>
         <div>
            G: <input type="range" id="sliderG" min="0" max="255" value="0">
            <input type="number" id="numberG" min="0" max="255" value="0">
        </div>
         <div>
            B: <input type="range" id="sliderB" min="0" max="255" value="0">
            <input type="number" id="numberB" min="0" max="255" value="0">
        </div>
        <div id="swatch"></div>
        <button id="sendColorButton">Send color</button>
        <br><br>
        Brightness:
        <input type="range" id="sliderBright" min="1" max="100" value="100">
        <span id="brightLabel">100%</span>
        <br><br>
        <div id="result1"></div>
        <div id="result2"></div>
        <br><br>
        <div id="presetSection">
            <input type="text" id="presetNameInput" placeholder="Preset name">
            <button id="savePresetButton">Save Preset</button>
            <div id="presetList"></div>
        </div>


    </body>
</html>
